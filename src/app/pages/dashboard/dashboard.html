<div class="flex h-screen bg-gray-50 -mt-8 font-sans">
  
  <aside class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col">
    <div class="p-6 border-b border-gray-100">
      <h2 class="text-xl font-black text-gray-800 flex items-center">

        <svg class="w-6 h-6 mr-2 text-violet-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        My Vault
      </h2>
    </div>
    
    <nav class="flex-1 p-4 space-y-2">
      <a href="#" class="flex items-center px-4 py-3 bg-violet-50 text-violet-700 rounded-xl font-bold transition-colors">
        All Items
      </a>
      <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl font-semibold transition-colors">
        Favorites
      </a>
      <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl font-semibold transition-colors">
        Trash
      </a>
    </nav>
  </aside>

  <main class="flex-1 flex flex-col overflow-hidden">
    
    <header class="bg-white border-b border-gray-200 p-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-800">Passwords</h1>
      <button class="bg-violet-600 text-white px-5 py-2.5 rounded-lg font-bold hover:bg-violet-700 transition-colors shadow-sm flex items-center">
        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        New Item
      </button>
    </header>

    <div class="flex-1 overflow-auto p-6">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 text-gray-500 text-sm uppercase tracking-wider">
              <th class="px-6 py-4 font-semibold">Platform</th>
              <th class="px-6 py-4 font-semibold">Username</th>
              <th class="px-6 py-4 font-semibold">Password</th>
              <th class="px-6 py-4 font-semibold text-right">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            
            <tr *ngFor="let item of passwords" class="hover:bg-gray-50 transition-colors group">
              
              <td class="px-6 py-4 flex items-center">
                <div class="w-10 h-10 rounded-lg {{ item.iconColor }} text-white flex items-center justify-center font-bold text-lg shadow-sm mr-4">
                  {{ item.platform.charAt(0) }}
                </div>
                <span class="font-bold text-gray-800">{{ item.platform }}</span>
              </td>
              
              <td class="px-6 py-4 text-gray-600 font-medium">
                {{ item.username }}
              </td>
              
              <td class="px-6 py-4">
                <div class="flex items-center text-gray-800 font-mono bg-gray-100 px-3 py-1.5 rounded-md w-max">

                  <span>{{ item.show ? item.password : '••••••••••••' }}</span>
                </div>
              </td>
              
              <td class="px-6 py-4 text-right space-x-2">

                <button (click)="togglePassword(item.id)" class="p-2 text-gray-400 hover:text-violet-600 transition-colors bg-white rounded-md border border-gray-200 shadow-sm">
                  Ojo
                </button>

                <button (click)="copiarPassword(item.password)" class="p-2 text-gray-400 hover:text-blue-600 transition-colors bg-white rounded-md border border-gray-200 shadow-sm">
                  Copiar
                </button>
              </td>

            </tr>

          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
