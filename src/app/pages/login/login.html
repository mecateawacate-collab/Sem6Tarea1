<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="max-w-md w-full bg-white rounded-2rem shadow-xl p-8 border border-gray-100 relative overflow-hidden">
    
    <div class="absolute top-0 left-0 w-full h-2 bg-violet-600"></div>

    <h2 class="text-3xl font-black text-gray-900 text-center mb-2 mt-4">Welcome Back</h2>
    <p class="text-center text-gray-500 mb-8 font-medium">Unlock your secure vault</p>
    
    <form (ngSubmit)="hacerLogin()" class="space-y-6">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Username</label>
        <input type="text" [(ngModel)]="usuario" name="usuario" 
               class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-2 focus:ring-violet-600 focus:border-transparent outline-none transition-all font-medium" 
               placeholder="admin">
      </div>
      
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Master Password</label>
        <input type="password" [(ngModel)]="password" name="password" 
               class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-2 focus:ring-violet-600 focus:border-transparent outline-none transition-all font-medium" 
               placeholder="1234">
      </div>

      <button type="submit" 
              class="w-full bg-violet-600 text-white font-bold py-3.5 rounded-xl hover:bg-violet-700 transition-colors shadow-lg shadow-violet-500/30 mt-4">
        Unlock Vault
      </button>
    </form>
  </div>
</div>
